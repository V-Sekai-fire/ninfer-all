name: V-Sekai Linux install check

# Installs a published release online with ninfer-install, as a Linux user would, and checks
# every restored file against payload-linux.sha256 and every shipped library against ldd.
# It needs no GPU and no build: the binaries are built and GPU-tested in WSL2 on the RTX 4090
# host (v-sekai/build.nu), and this job proves the published assets reassemble on a clean host.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published tag to install online and verify"
        required: true

jobs:
  install-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Install online with ninfer-install
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern ninfer-install --pattern payload-linux.sha256
          chmod +x ninfer-install
          ./ninfer-install --online --tag "$TAG" --repo "$GITHUB_REPOSITORY" --target "$RUNNER_TEMP/ninfer"
      - name: Compare every file by SHA-256
        run: |
          cd "$RUNNER_TEMP/ninfer"
          sha256sum --check --strict "$GITHUB_WORKSPACE/payload-linux.sha256"
          diff <(find . -type f | sed 's|^\./||' | sort) <(cut -c67- "$GITHUB_WORKSPACE/payload-linux.sha256" | sort)
      - name: Resolve the shipped library closure
        run: |
          cd "$RUNNER_TEMP/ninfer"
          for exe in bin/*; do
            test -x "$exe"
            if ldd "$exe" | grep 'not found' | grep -v 'libcuda\.so'; then exit 1; fi
          done
