name: V-Sekai Linux

# Builds the Linux x86-64 sm_89 binaries and ninfer-install with v-sekai/build.nu, and after a
# release is published, installs it online with ninfer-install and checks every file by SHA-256.
# CUDA compiles without a GPU, so a hosted runner builds the release binaries.

on:
  workflow_dispatch:
    inputs:
      check_tag:
        description: "Published tag to install online and verify (empty: build only)"
        default: ""
        required: false
  push:
    branches: [master]
    paths:
      - "v-sekai/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/v-sekai-linux.yml"

jobs:
  build:
    if: inputs.check_tag == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          environments: build
          cache: true
      - name: Build
        run: pixi run -e build nu v-sekai/build.nu
      - uses: actions/upload-artifact@v4
        with:
          name: ninfer-linux-sm89
          path: |
            dist/linux
            dist/tools-linux
          if-no-files-found: error

  install-check:
    if: inputs.check_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Install online with ninfer-install
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.check_tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern ninfer-install --pattern payload-linux.sha256
          chmod +x ninfer-install
          ./ninfer-install --online --tag "$TAG" --repo "$GITHUB_REPOSITORY" --target "$RUNNER_TEMP/ninfer"
      - name: Compare every file by SHA-256
        run: |
          cd "$RUNNER_TEMP/ninfer"
          sha256sum --check --strict "$GITHUB_WORKSPACE/payload-linux.sha256"
          diff <(find . -type f | sed 's|^\./||' | sort) <(cut -c67- "$GITHUB_WORKSPACE/payload-linux.sha256" | sort)
      - name: Resolve the shipped library closure
        run: |
          cd "$RUNNER_TEMP/ninfer"
          for exe in bin/*; do
            test -x "$exe"
            if ldd "$exe" | grep 'not found' | grep -v 'libcuda\.so'; then exit 1; fi
          done
