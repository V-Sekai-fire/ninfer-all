name: V-Sekai MSI release

# One run makes and publishes a Windows release: the MSI, its external CABs, and the
# SHA-256 manifests.
#   convert  (ubuntu)   fetch the conversion sources and convert Bonsai 2 Heretic v2 on the CPU,
#                       split into files below 2 GB (one CAB each)
#   build    (windows)  build ninfer-serve for sm_89 with pixi's CUDA 13 and Visual Studio 2022
#   package  (windows)  build the service host and the MSI, install it, check every file by
#                       SHA-256 and that the NInfer service runs, uninstall it, then publish
# Hosted runners have no GPU, so nothing here runs a model. The package job proves that the MSI
# installs the exact files, registers the service, and starts ninfer-serve under it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag: vX.Y.Z-dev.N, -beta.N or -rc.N (prerelease), or vX.Y.Z"
        required: true
        default: v0.12.0-dev.1
      publish:
        description: "Publish the GitHub release (off: keep the MSI as a workflow artifact only)"
        type: boolean
        default: true
      reuse_run:
        description: "Optional run ID whose model and dist-windows artifacts to package, skipping convert and build"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: v-sekai-msi-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}

jobs:
  convert:
    name: Convert the model (CPU)
    if: ${{ inputs.reuse_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(dev|beta|rc)\.[0-9]+)?$ ]] || { echo "::error::bad tag $TAG"; exit 1; }
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$TAG"; then
            echo "::error::tag $TAG already exists"; exit 1
          fi
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          environments: default
          locked: true
          cache: true
      - name: Fetch the conversion sources
        run: pixi run --locked nu v-sekai/fetch-sources.nu
      - name: Convert, split into files below 2 GB
        run: |
          pixi run --locked nu v-sekai/convert.nu --device cpu --max-file-bytes 1800000000
          ls -l models
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            models/
            sources/**/LICENSE
            sources/**/NOTICE
            sources/Heretic-v2-GGUF/README.md
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  build:
    name: Build ninfer-serve (Windows, sm_89)
    if: ${{ inputs.reuse_run == '' }}
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      # ptxas takes about 3 GB per softmax_attention kernel; four at once fit the runner's 16 GB.
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          environments: build
          locked: true
          cache: true
      - name: Build
        timeout-minutes: 345
        run: pixi run --locked -e build nu v-sekai/build.nu
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/windows/
          retention-days: 3
          if-no-files-found: error

  package:
    name: MSI, install check, publish
    needs: [convert, build]
    # Runs after both jobs succeed, or on its own with reuse_run.
    if: ${{ !cancelled() && (inputs.reuse_run != '' || (needs.convert.result == 'success' && needs.build.result == 'success')) }}
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Check the tag
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(dev|beta|rc)\.[0-9]+)?$ ]] || { echo "::error::bad tag $TAG"; exit 1; }
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          environments: build
          locked: true
          cache: true
      - name: Install WiX 5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix --version
      - uses: actions/download-artifact@v5
        with:
          name: dist-windows
          path: dist/windows
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v5
        with:
          name: model
          path: .
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Build the MSI
        run: |
          Get-PSDrive C
          pixi run --locked -e build nu v-sekai/msi.nu --tag $env:TAG --move-model
          Get-PSDrive C
      - name: Install the MSI
        run: |
          $out = "release\$env:TAG-msi"
          $msi = Get-ChildItem "$out\*.msi" | Select-Object -First 1
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v `"$env:RUNNER_TEMP\install.log`""
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 80; exit $p.ExitCode }
      - name: Check the installed files and the service
        run: |
          $out = "release\$env:TAG-msi"
          pixi run --locked -e build nu v-sekai/msi.nu verify --target "C:\Program Files\V-Sekai\NInfer" --manifest "$out\payload-msi.sha256"
          $flags = "C:\ProgramData\V-Sekai\NInfer\ninfer-serve.args"
          if (-not (Test-Path $flags)) { throw "missing $flags" }
          sc.exe qc NInfer
          # The service host starts ninfer-serve and logs its command line. With no GPU on the
          # runner ninfer-serve then stops, and the host keeps the service running to retry.
          $log = "C:\ProgramData\V-Sekai\NInfer\logs\ninfer-serve.log"
          $deadline = (Get-Date).AddMinutes(2)
          while (-not ((Test-Path $log) -and (Select-String -Path $log -Pattern '^ninfer-service: ' -Quiet))) {
            if ((Get-Date) -gt $deadline) { sc.exe query NInfer; throw "the service did not start ninfer-serve" }
            Start-Sleep -Seconds 5
          }
          Start-Sleep -Seconds 15
          Get-Content $log, "$log.1" -ErrorAction SilentlyContinue | Select-Object -First 40
          $state = (Get-Service NInfer).Status
          if ($state -ne 'Running') { throw "NInfer service is $state, expected Running" }
      - name: Uninstall and check the removal
        run: |
          $out = "release\$env:TAG-msi"
          $msi = Get-ChildItem "$out\*.msi" | Select-Object -First 1
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/x `"$($msi.FullName)`" /qn /l*v `"$env:RUNNER_TEMP\uninstall.log`""
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\uninstall.log" -Tail 80; exit $p.ExitCode }
          if (Get-Service NInfer -ErrorAction SilentlyContinue) { throw "the NInfer service is still registered" }
          if (Test-Path "C:\Program Files\V-Sekai\NInfer\models") { throw "the model is still installed" }
          if (-not (Test-Path "C:\ProgramData\V-Sekai\NInfer\ninfer-serve.args")) { throw "uninstall removed the flags file" }
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.publish }}
        with:
          name: msi
          path: release/${{ inputs.tag }}-msi/
          compression-level: 0
          retention-days: 3
      - name: Publish the release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          out="release/$TAG-msi"
          pre=""; [[ "$TAG" == *-* ]] && pre="--prerelease"
          msi=$(cd "$out" && ls *.msi)
          cat > notes.md <<EOF
          ninfer-all for one RTX 4090 (sm_89) on Windows x64, as one MSI that installs the NInfer Windows service, with Ternary Bonsai 2 27B Uncensored Heretic v2 as one v3 artifact: the t2_g128_fp16 ternary body, the Bonsai 2 MTP head and DFlash2 adapter, and the Qwen3.8-27B vision tower.

          Download $msi and every ninfer*.cab into one folder, then run the MSI. It installs into C:\\Program Files\\V-Sekai\\NInfer with the CUDA runtime, FFmpeg and the MSVC runtime, so the only thing the host needs is an NVIDIA driver of the CUDA 13 branch.

          The NInfer service starts automatically and serves an OpenAI-compatible API at http://127.0.0.1:8080/v1. Its flags are in C:\\ProgramData\\V-Sekai\\NInfer\\ninfer-serve.args (upgrades keep your edits), and its log is in C:\\ProgramData\\V-Sekai\\NInfer\\logs\\ninfer-serve.log. After an edit, restart the service: sc.exe stop NInfer, then sc.exe start NInfer.

          SHA256SUMS lists every asset. payload-msi.sha256 lists every installed file. Built from $GITHUB_SHA by the V-Sekai MSI release workflow. A hosted runner without a GPU checked the install (each file by SHA-256, and that the service starts ninfer-serve). That runner did not run the model.
          EOF
          # The Linux half (release.nu --linux-only on a Linux host) may have created the release first.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$out"/* --repo "$GITHUB_REPOSITORY" --clobber
            { cat notes.md; echo; gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body; } > notes-combined.md
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes-combined.md
          else
            gh release create "$TAG" "$out"/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $pre --title "$TAG" --notes-file notes.md
          fi
