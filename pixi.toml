[workspace]
name = "ninfer-all-v-sekai"
description = "Linux (Fedora 44, native or WSL2) sm_89 builds and dev.* desync releases of ninfer-all for Ternary Bonsai 2 27B Heretic; the converter also runs on macOS"
channels = ["conda-forge"]
platforms = ["linux-64", { name = "osx-arm64-macos14", platform = "osx-arm64", macos = "14.5" }]

[dependencies]
nushell = ">=0.116"
git = "*"
python = "3.12.*"
jinja2 = "*"

# The CUDA engine builds only on Linux. macOS has no CUDA.
[feature.build]
platforms = ["linux-64"]

[feature.build.dependencies]
cmake = ">=3.28"
ninja = "*"
go = ">=1.25"
zstd = ">=1.5.7,<2"
cuda-nvcc = "13.*"
cuda-cudart-dev = "13.*"
cuda-cudart-static = "13.*"
libcublas-dev = "13.*"
cuda-cccl = "13.*"
cuda-nvrtc-dev = "13.*"
cuda-nvtx-dev = "13.*"
cuda-version = "13.*"
ffmpeg = { version = "7.*", build = "lgpl*" }
libcurl = ">=8"
pkg-config = "*"

[feature.build.target.linux-64.dependencies]
gxx_linux-64 = "14.*"
sysroot_linux-64 = "2.28.*"
patchelf = "*"
binutils = "*"
gh = "*"
cuda-driver-dev = "13.*"
zlib = "*"

# The converter is pure Python on the CPU, so it runs on every platform.
[feature.convert.dependencies]
numpy = "*"
safetensors = "*"
pytorch-cpu = "*"
huggingface_hub = ">=0.28"
gguf = ">=0.19"

# Apple silicon serves .ninfer artifacts through MLX's Metal kernels.
[feature.mlx]
platforms = ["osx-arm64-macos14"]

[feature.mlx.dependencies]
numpy = "*"
mlx = ">=0.32"
mlx-lm = ">=0.32"
mlx-vlm = ">=0.6.17"

[environments]
default = { features = ["convert"], solve-group = "default" }
build = { features = ["build"], solve-group = "default" }
mlx = { features = ["mlx"] }

[target.linux-64.dependencies]
cuda-nvcc = ">=13.4.92,<14"
cuda-cudart-dev = ">=13.4.92,<14"
ffmpeg = ">=7.1.1,<8"
pkg-config = ">=0.29.2,<0.30"
zlib = ">=1.3.2,<2"
libcurl = ">=8.23.0,<9"
libcublas-dev = ">=13.8.0.4,<14"
cuda-nvtx-dev = ">=13.4.92,<14"

