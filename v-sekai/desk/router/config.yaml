# One OpenAI-compatible port (127.0.0.1:18000) for every Bonsai 2 Heretic server.
# Backends are the Mac ends of the mTLS tunnels (com.chibifire.ninfer-tunnel).
# "bonsai" spreads over whichever servers are up: the tower dual-boots, so only the
# desk pair or the Fedora pair answers at a time; a dead backend is cooled down and skipped.
model_list:
  - model_name: bonsai
    litellm_params: {model: openai/bonsai-27b, api_base: http://127.0.0.1:18091/v1, api_key: os.environ/BONSAI_DESK_API_KEY}
    model_info: {id: desk-4090}
  - model_name: bonsai
    litellm_params: {model: openai/bonsai-27b, api_base: http://127.0.0.1:18092/v1, api_key: os.environ/BONSAI_DESK_API_KEY}
    model_info: {id: desk-3090}
  - model_name: bonsai
    litellm_params: {model: openai/bonsai2-27b, api_base: http://127.0.0.1:18080/v1, api_key: os.environ/BONSAI_FEDORA_API_KEY}
    model_info: {id: fedora-4090}
  - model_name: bonsai
    litellm_params: {model: openai/bonsai2-27b, api_base: http://127.0.0.1:18081/v1, api_key: os.environ/BONSAI_FEDORA_API_KEY}
    model_info: {id: fedora-3090}
  # Pin one card by name.
  - model_name: bonsai-desk-4090
    litellm_params: {model: openai/bonsai-27b, api_base: http://127.0.0.1:18091/v1, api_key: os.environ/BONSAI_DESK_API_KEY}
  - model_name: bonsai-desk-3090
    litellm_params: {model: openai/bonsai-27b, api_base: http://127.0.0.1:18092/v1, api_key: os.environ/BONSAI_DESK_API_KEY}
  - model_name: bonsai-fedora-4090
    litellm_params: {model: openai/bonsai2-27b, api_base: http://127.0.0.1:18080/v1, api_key: os.environ/BONSAI_FEDORA_API_KEY}
  - model_name: bonsai-fedora-3090
    litellm_params: {model: openai/bonsai2-27b, api_base: http://127.0.0.1:18081/v1, api_key: os.environ/BONSAI_FEDORA_API_KEY}

router_settings:
  routing_strategy: least-busy
  num_retries: 3
  allowed_fails: 1
  cooldown_time: 60
  timeout: 600

litellm_settings:
  drop_params: true
  telemetry: false

general_settings:
  master_key: os.environ/MODEL_ROUTER_API_KEY
